# chatlog-exporter global default configuration
# Edit this file to override default values for all scripts.
# You can also specify another file with the --config <path> option.

# Agent
# Default agent used when no agent is given on the command line.
# Priority: CLI argument > this file > built-in default ("claude").
# Supported: claude, codex, chatgpt
agent: claude

# AI execution
model: "haiku"
timeoutMs: 300_000 # 5 min (ms)
maxRetry: 2 # Max retry count for runAI (0 = no retry, max 10)

# Hash generation
hashLength: 8
minRandomLength: 4
maxRandomLength: 16

# Parallel / batch processing
chunkSize: 5
concurrency: 4

# Character count filters
minCharCount: 1000 # Minimum content length
minAssistantChars: 300 # Minimum assistant response length (when userTurns=1)
maxContentLength: 4000 # Maximum content length

# DISCARD threshold (filter-chatlog)
discardThreshold: 0.7 # Remove DISCARD entries with confidence >= this value

# Asset directories (relative to .config/<app-name>/)
dicsDir: "dics"
promptsDir: "prompts"
chatlogsDir: "${ProjectRoot}/chatlogs"

# Temporary cache
cacheDir: "${TEMP}/cle-cache"
