# chatlog-exporter global default configuration
# Edit this file to override default values for all scripts.
# You can also specify another file with the --config <path> option.

# Agent
# Default agent used when no agent is given on the command line.
# Priority: CLI argument > this file > built-in default ("claude").
# Supported: claude, codex, chatgpt
agent: claude

# AI execution
# model selects the AI backend. It is independent of "agent" (the export source).
# Use "llama/<model>" to call the llama server set in llamaEndpoint over HTTP.
model: "llama/avalon" # local llama server. Empty = built-in default "sonnet"
timeoutMs: 300_000 # 5 min (ms)
maxRetry: 2 # Max retry count for runAI (0 = no retry, max 10)

# Llama backend
# Endpoint URL of the llama server on the LAN. Empty string means unset.
llamaEndpoint: "http://avalon:8080/" # develop machines endpoint

# Hash generation
hashLength: 8
minRandomLength: 4
maxRandomLength: 16

# Parallel / batch processing
chunkSize: 2
concurrency: 1 # must not exceed the llama server slot count (--parallel)

# Character count filters
minCharCount: 1000 # Minimum content length
minAssistantChars: 300 # Minimum assistant response length (when userTurns=1)
# Measured on avalon 2026-09-29. See docs/.deckrd/libs/ai-backend/workspaces/measurements-context-limits-2026-09-29.md
maxContentLength: 10000 # Maximum content length. Gate: cold meta 111.1s (<= 180s), corpus 1.49x of 4000
maxBodyChars: 10000 # Maximum body length embedded per chatlog in a batch prompt. Gate: cold 136.2s worst of 3

# DISCARD threshold (filter-chatlog)
discardThreshold: 0.7 # Remove DISCARD entries with confidence >= this value

# Asset directories (relative to .config/<app-name>/)
dicsDir: "dics"
promptsDir: "prompts"
chatlogsDir: "${ProjectRoot}/chatlogs"

# Temporary cache
cacheDir: "${TEMP}/cle-cache"
