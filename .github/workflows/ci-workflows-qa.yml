name: "CI Workflows QA"

# Minimal permissions following security best practices
permissions:
  contents: read

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  actionlint:
    name: Actionlint
    permissions:
      contents: read
    uses: aglabo/ci-platform/.github/workflows/ru-qa-actionlint.yml@14c82cd1052ef48b10f58f7e814ad52fa328c50f # v0.3.5

  ghalint:
    name: Ghalint
    permissions:
      contents: read
    uses: aglabo/ci-platform/.github/workflows/ru-qa-ghalint.yml@14c82cd1052ef48b10f58f7e814ad52fa328c50f # v0.3.5
