pre-commit:
  parallel: true
  commands:
    betterleaks:
      run: betterleaks protect --config ./configs/betterleaks.toml --staged

    secretlint:
      glob: "**/*"
      run: >
        secretlint
        --secretlintrc ./configs/secretlint.config.yaml
        --secretlintignore .gitignore
        --maskSecrets
        "{staged_files}"
      skip:
        - empty

# verify the distributable skill assets are regenerated from their sources.
# reads the committed tree, not the working tree: regenerating the assets without
# committing them would otherwise pass here and let the drift reach the remote.
pre-push:
  commands:
    skill-assets:
      run: bash ./scripts/sync-skill-assets.sh --check-head

prepare-commit-msg:
  commands:
    prepare-message-script:
      run: bash -c './scripts/prepare-commit-msg.sh --model gpt-5.5 --output "{1}"'

# check commit message as Conventional Commit
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: commitlint --config ./configs/commitlint.config.js --edit
